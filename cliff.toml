# git-cliff configuration: https://git-cliff.org/docs/configuration
#
# Generates the entries for one release, in the same Keep a Changelog style as
# CHANGELOG.md. The `changelog:update` mise task prepends them to the file,
# which starts directly with the latest release, so no header or footer is
# rendered here.

[changelog]
# No `header` key: even an empty one renders as a leading blank line.
# The `<!-- n -->` prefix on each group only orders the groups as Keep a
# Changelog does (Added, Changed, Removed, Fixed); `striptags` removes it.
body = """
{% if version -%}
    ## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Drop commits like a bare "chore" that don't follow Conventional Commits.
filter_unconventional = true
# The first matching parser wins. Only user-facing changes are kept: features,
# fixes, performance and breaking changes. Everything else (chore, docs,
# refactor, test, ...) is skipped.
commit_parsers = [
    { message = '^(feat|fix|perf)(\(.*\))?!?: (remove|delete|drop)', group = "<!-- 2 -->Removed" },
    { message = '^feat', group = "<!-- 0 -->Added" },
    { message = '^fix', group = "<!-- 3 -->Fixed" },
    { message = '^perf', group = "<!-- 1 -->Changed" },
    { field = "breaking", pattern = "true", group = "<!-- 1 -->Changed" },
    { message = '.*', skip = true },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
